name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core (JUnit + jqwik)
        run: ./gradlew :core:test
      - name: Build PWA (TeaVM)
        run: ./gradlew :web:assemblePwa -Pteavm.js.obfuscated=true -Pteavm.js.sourceMap=false
      - uses: actions/upload-artifact@v4
        with:
          name: pwa
          path: web/build/pwa
