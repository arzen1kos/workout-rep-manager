org.gradle.jvmargs=-Xmx1g
org.gradle.caching=true

# TeaVM properties (prefix "teavm." is how the plugin reads them from gradle.properties).
# Dev defaults: readable output plus source maps. For a release build pass:
#   ./gradlew :web:assemblePwa -Pteavm.js.obfuscated=true -Pteavm.js.sourceMap=false
teavm.js.obfuscated=false
teavm.js.sourceMap=true
